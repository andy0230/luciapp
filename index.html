  /* ---------- HISTORIAL DE SESIONES (últimas 60 por perfil) ---------- */
  function cargarSesiones(){ return leerJSON(claves('sesiones'),[],Array.isArray).filter(function(r){ return esObjeto(r) && typeof r.fecha==='string' && typeof r.duracion==='number'; }); }
  function guardarSesiones(arr){ escribir(claves('sesiones'),arr); }
  function guardarSesionActual(){
    if(perfilActual==null) return;
    if(minutosSesion()<1 && Object.keys(sesionActividades).length===0) return;
    var arr=cargarSesiones();
    var registro={fecha:fechaLocal(), inicioMs:sesionInicio,
      duracion:minutosSesion(), actividades:Object.keys(sesionActividades), conteo:sesionActividades, aciertos:sesionAciertos, intentos:sesionIntentos};
    if(arr.length && arr[arr.length-1].inicioMs===sesionInicio){ arr[arr.length-1]=registro; }
    else { arr.push(registro); if(arr.length>60) arr=arr.slice(arr.length-60); }
    guardarSesiones(arr);
    var dias={}; arr.forEach(function(r){ dias[r.fecha]=true; });
    if(Object.keys(dias).length>=3) desbloquear('racha_3dias');
  }
  function formatoFecha(f){
    var hoy=fechaLocal(), ayerD=fechaLocal(new Date(Date.now()-86400000));
    if(f===hoy) return 'Hoy'; if(f===ayerD) return 'Ayer';
    var p=String(f).split('-'); return p.length===3? (p[2]+'/'+p[1]+'/'+p[0]) : f;
  }
  /* Actividades favoritas (las más repetidas en el historial). */
  function actividadesFavoritas(n){
    var c={}; cargarSesiones().forEach(function(s){ (s.actividades||[]).forEach(function(a){ var v=(s.conteo&&s.conteo[a])||1; c[a]=(c[a]||0)+v; }); });
    return Object.keys(c).sort(function(a,b){return c[b]-c[a];}).slice(0,n||3).map(function(k){return {nombre:k,veces:c[k]};});
  }

  /* ---------- GALERÍA DE DIBUJOS ----------
     Miniaturas JPEG de 320 px (≈15–25 KB). Solo se aceptan data:image/(png|jpeg). Si el
     almacenamiento se llena NO se borran dibujos en silencio: se avisa al adulto. */
  var MAX_GALERIA=30;
  function urlImagenValida(u){ return typeof u==='string' && /^data:image\/(png|jpeg);base64,[A-Za-z0-9+/=]+$/.test(u) && u.length<400000; }
  function cargarGaleria(){ return leerJSON(claves('galeria'),[],Array.isArray).filter(function(g){ return esObjeto(g) && urlImagenValida(g.url); }); }
  function guardarGaleria(arr){ return escribir(claves('galeria'),arr); }
  function agregarAGaleria(dataURL,cb){
    try{ var img=new Image();
      img.onload=function(){
        var S=320, c=document.createElement('canvas'); c.width=S;c.height=S; var cx=c.getContext('2d');
        cx.fillStyle='#fff'; cx.fillRect(0,0,S,S);
        var e=Math.min(S/img.width,S/img.height), w=img.width*e, h=img.height*e;
        cx.drawImage(img,(S-w)/2,(S-h)/2,w,h);
        var gal=cargarGaleria(); gal.push({id:Date.now(),url:c.toDataURL('image/jpeg',0.82),fecha:fechaLocal()});
        var lleno=gal.length>MAX_GALERIA;
        if(lleno){ if(cb) cb(false,'lleno'); return; }
        if(!guardarGaleria(gal)){ if(cb) cb(false,'cuota'); return; }
        if(gal.length>=5) desbloquear('artista_5'); if(cb)cb(true);
      };
      img.onerror=function(){ if(cb)cb(false); };
      img.src=dataURL;
    }catch(e){ if(cb)cb(false); }
  }

  /* ---------- ¿QUÉ SIGUE? (patrones, con dificultad adaptativa) ---------- */
  var PATRON_TEMAS=[['🍎','🍌'],['🔵','🟡'],['🐶','🐱'],['🔴','🔵','🟢'],['⭐','🌙','☀️']];
  var PATRON_EXTRA=['🍓','🟣','🦋','🍇','🌈'];
  function generarPatron(fase){
    var simbolos = fase<=1 ? PATRON_TEMAS[fase%2] : PATRON_TEMAS[fase===2?2:(3+((fase-3)%2))];
    var n=simbolos.length, secuencia=[]; for(var i=0;i<4;i++) secuencia.push(simbolos[i%n]);
    var respuesta=simbolos[4%n]; var ops=fase<=1?2:3;
    var distractores=shuffle(simbolos.slice()).filter(function(s){return s!==respuesta;});
    var extra=shuffle(PATRON_EXTRA.slice());
    for(var k=0;k<extra.length && distractores.length<ops-1;k++){ if(distractores.indexOf(extra[k])<0) distractores.push(extra[k]); }
    var opciones=[respuesta].concat(distractores.slice(0,ops-1)); shuffle(opciones);
    return {secuencia:secuencia,respuesta:respuesta,opciones:opciones};
  }

    pantallaBase(mundoJugar,{mundo:'jugar'}); marcarActividad('¿Qué sigue?');

      var sub=document.createElement('p');sub.className='subtitulo';sub.textContent='¿Qué sigue después?';
      app.appendChild(sub);
      var grid=document.createElement('div');grid.className='opciones';

          if(o===pat.respuesta){ bloqueado=true;c.classList.add('bien');sonidoBien();fx(c,'¡Sí! Lo encontraste',e);

  /* ---------- ARRASTRAR O TOCAR (para niños de 3 años: las dos formas sirven) ----------
     Cada pieza se puede arrastrar hasta su destino, o tocar la pieza y luego tocar el destino.
     Si el destino no es el correcto, la pieza vuelve suavemente a su lugar: no hay castigo. */
  function crearArrastre(cfg){
    var sel=null;
    function objetivos(){ return cfg.objetivos(); }
    function marcar(on){ objetivos().forEach(function(t){ t.classList.toggle('objetivo-tap',on); }); }
    function deseleccionar(){ if(sel) sel.classList.remove('sel'); sel=null; marcar(false); }
    function volver(p){ p.classList.add('volver'); p.style.transform=''; setTimeout(function(){p.classList.remove('volver');},400); }
    function intentar(p,t){ var ok=cfg.soltar(p,t); if(!ok) volver(p); }
    function objetivoEn(x,y){ var ts=objetivos(); for(var i=0;i<ts.length;i++){ var r=ts[i].getBoundingClientRect(); if(x>=r.left-10&&x<=r.right+10&&y>=r.top-10&&y<=r.bottom+10) return ts[i]; } return null; }
    function pieza(p){
      var ini=null, movido=false;
      p.addEventListener('pointerdown',function(e){ if(p.dataset.fijo) return; ini={x:e.clientX,y:e.clientY}; movido=false; try{p.setPointerCapture(e.pointerId);}catch(_){} });
      p.addEventListener('pointermove',function(e){ if(!ini) return; var dx=e.clientX-ini.x, dy=e.clientY-ini.y;
        if(!movido && Math.sqrt(dx*dx+dy*dy)>12){ movido=true; deseleccionar(); p.classList.add('arrastrando'); if(cfg.alTomar) cfg.alTomar(p); }
        if(movido){ e.preventDefault(); p.style.transform='translate('+dx+'px,'+dy+'px) scale(1.08)';
          var t=objetivoEn(e.clientX,e.clientY); objetivos().forEach(function(o){o.classList.toggle('objetivo-tap',o===t);}); }
      });
      p.addEventListener('pointerup',function(e){ if(!ini) return; ini=null; p.classList.remove('arrastrando');
        if(movido){ marcar(false); var t=objetivoEn(e.clientX,e.clientY); if(t) intentar(p,t); else volver(p); }
        else { if(sel===p){ deseleccionar(); } else { deseleccionar(); sel=p; p.classList.add('sel'); marcar(true); sonidoTap(); if(cfg.alTomar) cfg.alTomar(p); } }
      });
      p.addEventListener('pointercancel',function(){ ini=null; p.classList.remove('arrastrando'); marcar(false); volver(p); });
    }
    function objetivo(t){ t.addEventListener('click',function(){ if(!sel){ if(cfg.sinPieza) cfg.sinPieza(); return; } var p=sel; deseleccionar(); intentar(p,t); }); }
    return {pieza:pieza, objetivo:objetivo, deseleccionar:deseleccionar};
  }

  /* ---------- ROMPECABEZAS (piezas reales cortadas de un dibujo; arrastrar o tocar) ----------
     El tablero muestra una "sombra" tenue de cada pieza, así la niña busca dónde se ve igual.
     Si suelta una pieza en otro lugar, vuelve sola a la bandeja y se ilumina el lugar correcto.
     Dificultad adaptativa: 4 piezas → 6 piezas → 9 piezas. */
  var ROMPECABEZAS_ITEMS=[].concat(frutas,animales,transporte,comida);
  var FONDOS_PUZZLE=['#DCEBFA','#FDEDC8','#FBDDD6','#DAF1E2','#E8E0F6'];
  function cortarDibujo(emoji,fondo,filas,cols,S){
    var cv=document.createElement('canvas'); cv.width=S; cv.height=S; var c=cv.getContext('2d');
    c.fillStyle=fondo; c.fillRect(0,0,S,S);
    c.fillStyle='rgba(255,255,255,.55)'; c.beginPath(); c.arc(S*0.5,S*0.55,S*0.42,0,Math.PI*2); c.fill();
    c.textAlign='center'; c.textBaseline='middle';
    var FAM='px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif', F=Math.round(S*0.62);
    c.font=F+FAM; var mw=c.measureText(emoji).width; if(mw>S*0.8){ F=Math.floor(F*S*0.8/mw); c.font=F+FAM; }
    c.fillText(emoji,S/2,S*0.53);
    var piezas=[], w=S/cols, h=S/filas;
    for(var f=0;f<filas;f++) for(var k=0;k<cols;k++){
      var pc=document.createElement('canvas'); pc.width=Math.round(w); pc.height=Math.round(h);
      pc.getContext('2d').drawImage(cv,k*w,f*h,w,h,0,0,pc.width,pc.height);
      piezas.push(pc.toDataURL('image/png'));
    }
    return {full:cv.toDataURL('image/png'),piezas:piezas};
  }
  function rompecabezas(){
    pantallaBase(mundoJugar,{mundo:'jugar'}); marcarActividad('Rompecabezas');
    cargarAdapt(); ronda();
    function ronda(){
      app.innerHTML=''; app.scrollTop=0;
      titulo('Rompecabezas');
      var a=adapt.rompecabezas||{n:0,racha:0}; adapt.rompecabezas=a;
      var forma=[[1,2],[2,2],[2,3],[3,3]][Math.min(a.n,configPerfil.dificultad==='reto'?3:(configPerfil.dificultad==='facil'?1:2))], filas=forma[0], cols=forma[1];
      var sub=document.createElement('p');sub.className='subtitulo';sub.textContent='Lleva cada pieza a donde se ve igual';
      app.appendChild(sub);
      var item=ROMPECABEZAS_ITEMS[rnd(ROMPECABEZAS_ITEMS.length)];
      var disp=Math.min(window.innerWidth*0.4, window.innerHeight-260, 420);
      var celda=Math.max(80,Math.floor(disp/cols));
      var dib=cortarDibujo(item.e,FONDOS_PUZZLE[rnd(FONDOS_PUZZLE.length)],filas,cols,celda*Math.max(cols,filas)*2);
      var wrap=document.createElement('div');wrap.className='puzzle-wrap';
      var tablero=document.createElement('div');tablero.className='puzzle-tablero';
      var altoCelda=Math.round(celda*cols/filas); // cada pieza conserva la proporción del recorte
      tablero.style.gridTemplateColumns='repeat('+cols+','+celda+'px)'; tablero.style.gridTemplateRows='repeat('+filas+','+altoCelda+'px)';

  function encajaFormas(){

      app.innerHTML=''; app.scrollTop=0;

        alTomar:function(p){ hablar(FORMAS_SVG[p.dataset.k].n); },
        sinPieza:function(){ hablar('Primero toca una forma'); },

            p.dataset.fijo='1'; p.style.visibility='hidden'; p.style.transform='';

            var r=t.getBoundingClientRect(); chispas(r.left+r.width/2,r.top+r.height/2);
            puestas++; if(puestas>=cuantas) terminar();
            return true;
          }

  /* ---------- BURBUJAS (causa-efecto + discriminación de colores, números y vocales) ----------
     Las burbujas suben despacio; se revientan las que se piden. Si toca otra, solo se le dice
     qué era ("esa es azul"): no hay tiempo límite ni se pierde nada. Cada burbuja correcta se
     cuenta en voz alta (uno, dos, tres...). */
  var BURB_COLS=[{n:'rojo',f:'roja',pl:'rojas',hex:'#EC6A55'},{n:'azul',f:'azul',pl:'azules',hex:'#4D9BE6'},{n:'amarillo',f:'amarilla',pl:'amarillas',hex:'#F5CF3F'},
                 {n:'verde',f:'verde',pl:'verdes',hex:'#4CB672'},{n:'morado',f:'morada',pl:'moradas',hex:'#9677D3'},{n:'rosado',f:'rosada',pl:'rosadas',hex:'#F291BE'}];
  function burbujas(){
    pantallaBase(mundoJugar,{mundo:'jugar'}); marcarActividad('Burbujas');
    cargarAdapt(); var rondasHechas=0, intervalo=null;
    ronda();
    function ronda(){
      if(intervalo){ window.clearInterval(intervalo); intervalo=null; }
      app.innerHTML=''; app.scrollTop=0;
      var a=adapt.burbujas||{n:0,racha:0}; adapt.burbujas=a;
      var fase=Math.min(a.n,configPerfil.dificultad==='reto'?3:1), META=5, logradas=0, errores=0;
      var obj, distract, etiqueta, frase, decirOtra;
      if(fase<=1){
        var pal=shuffle(BURB_COLS.slice()).slice(0,fase===0?2:4);
        obj=pal[0]; distract=pal.slice(1);
        etiqueta=function(x){return '';}; colorDe=function(x){return x.hex;};
        frase='Revienta las burbujas '+obj.pl; decirOtra=function(x){return 'Esa es '+x.f;};
      } else if(fase===2){
        var nums=shuffle([1,2,3,4,5]).slice(0,4).map(function(n){return {v:n};});
        obj=nums[0]; distract=nums.slice(1);
        etiqueta=function(x){return x.v;}; colorDe=function(){return BURB_COLS[rnd(BURB_COLS.length)].hex;};
        frase='Revienta las burbujas con el número '+palabras[obj.v]; decirOtra=function(x){return 'Ese es el '+palabras[x.v];};
      } else {
        var vs=shuffle(['A','E','I','O','U']).slice(0,4).map(function(l){return {v:l};});
        obj=vs[0]; distract=vs.slice(1);
        etiqueta=function(x){return x.v;}; colorDe=function(){return BURB_COLS[rnd(BURB_COLS.length)].hex;};
        frase='Revienta las burbujas con la letra '+obj.v; decirOtra=function(x){return 'Esa es la letra '+x.v;};
      }
      var pr=document.createElement('button');pr.type='button';pr.className='prompt';
      pr.innerHTML='<span class="sp">🔊</span><span>'+frase+'</span>'+(fase<=1?'<span style="width:34px;height:34px;border-radius:50%;border:2px solid var(--tinta);background:'+obj.hex+'"></span>':'');
      pr.addEventListener('click',function(){hablar(frase);animarIconoSonido(pr.querySelector('.sp'));});
      app.appendChild(pr);
      var marc=document.createElement('div');marc.className='marcador';
      for(var i=0;i<META;i++){var m=document.createElement('i');m.style.setProperty('--bc',fase<=1?obj.hex:'var(--sol)');marc.appendChild(m);}
      app.appendChild(marc);
      var zona=document.createElement('div');zona.className='burbujero';app.appendChild(zona);
      var quieto=reduce();
      function crear(){
        if(!document.body.contains(zona)){ window.clearInterval(intervalo); intervalo=null; return; }
        if(zona.querySelectorAll('.burbuja:not(.pum)').length>=(quieto?8:7)) return;
        var esObj=Math.random()<0.45, x=esObj?obj:distract[rnd(distract.length)];
        var W=zona.clientWidth, H=zona.clientHeight;
        var d=Math.round(Math.max(92,Math.min(150,W/7))*(0.85+Math.random()*0.3));
        var b=document.createElement('button');b.type='button';b.className='burbuja';
        b.style.setProperty('--d',d+'px'); b.style.setProperty('--bc',colorDe(x)); b.style.setProperty('--t',(fase===0?11:9.5)+Math.random()*2+'s');
        b.style.left=Math.round(Math.random()*Math.max(1,W-d))+'px';
        if(quieto){ b.style.bottom='auto'; b.style.top=Math.round(Math.random()*Math.max(1,H-d))+'px'; }
        b.textContent=etiqueta(x);
        b.addEventListener('animationend',function(ev){ if(ev.animationName==='flota') b.remove(); });
        b.addEventListener('pointerdown',function(ev){
          ev.preventDefault();
          if(b.classList.contains('pum')) return;
          if(x===obj){
            var tr=getComputedStyle(b).transform; b.style.setProperty('--pos',tr==='none'?'none':tr); b.style.transform=tr==='none'?'':tr;
            b.classList.add('pum'); setTimeout(function(){b.remove();},320);
            sonidoPop(); logradas++; registrarStat('burbujas',true);
            var mk=marc.children[logradas-1]; if(mk){mk.className='on';animarTap(mk,'rebota',350);}
            hablar(palabras[logradas]);
            if(logradas>=META) terminar();
          } else {
            errores++; registrarStat('burbujas',false); animarTap(b,'rebota',350); hablar(decirOtra(x));
          }
        });
        zona.appendChild(b);
      }
      for(var k=0;k<(quieto?6:3);k++) setTimeout(crear,k*350);
      intervalo=intervaloPantalla(crear,quieto?1400:900);
      setTimeout(function(){hablar(frase);},300);
      function terminar(){
        window.clearInterval(intervalo); intervalo=null; rondasHechas++;
        registrarAdaptativo('burbujas',errores<=2,0,3);
        if(rondasHechas>=3) desbloquear('burbujas_win');
        setTimeout(function(){
          sonidoGane(); celebrar(12); hablar('¡Cinco burbujas! ¡Muy bien!');
          Array.prototype.forEach.call(zona.querySelectorAll('.burbuja'),function(x){ x.style.transition='opacity .4s'; x.style.opacity='0'; });
          var f=document.createElement('div');f.className='fiesta';f.style.position='absolute';f.style.inset='0';f.style.justifyContent='center';f.style.maxWidth='none';
          f.innerHTML=personajeSVG('animando',120);
          var btns=document.createElement('div');btns.className='btns';
          var b1=document.createElement('button');b1.className='btng';b1.style.background='var(--pasto)';b1.style.color='#fff';b1.textContent='¡Más burbujas!';
          b1.addEventListener('click',function(){ronda();});
          var b2=document.createElement('button');b2.className='btng';b2.textContent='Otro juego';
          b2.addEventListener('click',function(){mundoJugar();});
          btns.appendChild(b1);btns.appendChild(b2);f.appendChild(btns);zona.appendChild(f);
        },500);
      }
    }
    var colorDe=function(){return '#fff';};
  }

  /* ---------- TRAZAR ---------- */
  function trazar(){
    pantallaBase(mundoCrear,{mundo:'crear'}); marcarActividad('Trazar');
    var setL='ABC', idx=0, color='#4D8BFF', W=0,H=0,ctx=null;
    var letras=(configPerfil.dificultad==='reto'?'ABCDEFGHIJKLMNÑOPQRSTUVWXYZ':'AEIOU').split('');
    var nums=(configPerfil.dificultad==='reto'?'0123456789':'123').split('');
    var numsSay=['cero','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve'];
    function lista(){return setL==='ABC'?letras:nums;}
    var cont=document.createElement('div');cont.className='pintar';
    var tabs=document.createElement('div');tabs.className='tabs';
    var tA=document.createElement('button');tA.className='tab sel';tA.type='button';tA.textContent='ABC';
    var tN=document.createElement('button');tN.className='tab';tN.type='button';tN.textContent='123';
    tabs.appendChild(tA);tabs.appendChild(tN);
    var wrap=document.createElement('div');wrap.className='lienzo-wrap';
    var cv=document.createElement('canvas');wrap.appendChild(cv);
    var puntoDom=document.createElement('div');puntoDom.className='puntoinicio';puntoDom.style.display='none';wrap.appendChild(puntoDom);
    var tools=document.createElement('div');tools.className='herramientas';
    cont.appendChild(tabs);cont.appendChild(wrap);cont.appendChild(tools);app.appendChild(cont);
    var pal=['#4D8BFF','#FF5D5D','#3FC46B','#9B6BFF','#FF9F45'],sw=[];
    pal.forEach(function(hex){var t=document.createElement('button');t.className='tinta';t.type='button';t.style.background=hex;
      if(hex===color)t.classList.add('sel');
      t.addEventListener('click',function(){color=hex;sw.forEach(function(s){s.classList.remove('sel');});t.classList.add('sel');});
      sw.push(t);tools.appendChild(t);});
    function tb(html,fn){var b=document.createElement('button');b.className='toolp';b.type='button';b.innerHTML=html;b.addEventListener('click',fn);tools.appendChild(b);return b;}
    function decir(){var ch=lista()[idx];hablar(setL==='ABC'?('letra '+ch):numsSay[parseInt(ch,10)]);}

    // ---- Validación geométrica aproximada del trazo ----
    // No hay reconocimiento caligráfico real: se compara, por coordenadas, el camino que
    // dibujó el dedo contra los píxeles de la guía (la letra/número gris de fondo).
    var fsActual=0, inicioPt=null, finPt=null, mascara=[], trazoPuntos=[];
    function distancia(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }
    function calcularMascara(){
      var pts=[]; if(!ctx)return pts;
      try{
        var dpr=window.devicePixelRatio||1;
        var datos=ctx.getImageData(0,0,cv.width,cv.height).data;
        var paso=Math.max(6,Math.round(9*dpr));
        for(var y=0;y<cv.height;y+=paso){
          for(var x=0;x<cv.width;x+=paso){
            var i=(y*cv.width+x)*4;
            if(!(datos[i]>250 && datos[i+1]>250 && datos[i+2]>250)){ pts.push({x:x/dpr,y:y/dpr}); }
          }
        }
      }catch(e){}
      // Reduce a un número manejable de puntos representativos.
      if(pts.length>220){ var k=Math.ceil(pts.length/220); pts=pts.filter(function(_,i){return i%k===0;}); }
      return pts;
    }
    function calcularFin(pts,inicio){
      if(!pts.length) return inicio;
      var mejor=pts[0], mejorPunt=-Infinity;
      pts.forEach(function(p){ var punt=p.y+p.x*0.35; if(punt>mejorPunt){mejorPunt=punt; mejor=p;} });
      return mejor;
    }
    function validarTrazo(){
      if(trazoPuntos.length<6) return {nivel:'bajo',score:0};
      var hol=configPerfil.dificultad==='reto'?1:1.4; var tolGuia=fsActual*0.17*hol, tolIni=fsActual*0.32*hol, tolFin=fsActual*0.36*hol, tolCobertura=fsActual*0.22*hol;
      var dentro=0;
      trazoPuntos.forEach(function(p){ var min=Infinity;
        for(var i=0;i<mascara.length;i++){ var d=distancia(p,mascara[i]); if(d<min)min=d; if(min<tolGuia)break; }
        if(min<tolGuia) dentro++;
      });
      var pctGuia = dentro/trazoPuntos.length;
      var cubiertos=0;
      mascara.forEach(function(m){ var min=Infinity;
        for(var i=0;i<trazoPuntos.length;i++){ var d=distancia(m,trazoPuntos[i]); if(d<min)min=d; if(min<tolCobertura)break; }
        if(min<tolCobertura) cubiertos++;
      });
      var pctCobertura = mascara.length? cubiertos/mascara.length : 0;
      var inicioOk = inicioPt ? distancia(trazoPuntos[0],inicioPt) < tolIni : true;
      var finOk = finPt ? distancia(trazoPuntos[trazoPuntos.length-1],finPt) < tolFin : true;
      var score = pctCobertura*0.45 + pctGuia*0.30 + (inicioOk?0.125:0) + (finOk?0.125:0);
      var nivel = score>=0.55 ? 'alto' : (score>=0.28 ? 'medio' : 'bajo');
      return {nivel:nivel,score:score};
    }
    function guia(){ if(!ctx)return; ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,W,H);
      var ch=lista()[idx]; var fs=Math.min(H*0.82,W*0.82); fsActual=fs;
      ctx.fillStyle='#E7E1F2';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.font='700 '+fs+'px Fredoka, sans-serif'; ctx.fillText(ch,W/2,H/2+fs*0.03);
      inicioPt={x:W/2-fs*0.32,y:H/2-fs*0.32};
      // punto de inicio: ayuda a saber por dónde empezar a trazar, sin exigir precisión.
      ctx.beginPath(); ctx.arc(inicioPt.x,inicioPt.y,7,0,Math.PI*2); ctx.fillStyle='#3FC46B'; ctx.fill();
      puntoDom.style.left=inicioPt.x+'px'; puntoDom.style.top=inicioPt.y+'px'; puntoDom.style.display='block';
      mascara=calcularMascara(); finPt=calcularFin(mascara,inicioPt); trazoPuntos=[];
    }
    function ir(d){var L=lista();idx=(idx+d+L.length)%L.length;guia();decir();}
    tb('<span aria-hidden="true">⬅️</span><span class="solo-lector">Anterior</span>',function(){ir(-1);}); tb('<span aria-hidden="true">🧽</span><span class="solo-lector">Borrar</span>',function(){guia();}); tb('<span aria-hidden="true">➡️</span><span class="solo-lector">Siguiente</span>',function(){ir(1);});
    tb('<span aria-hidden="true">✅</span><span class="solo-lector">Listo</span>',function(){
      var r=validarTrazo();
      registrarStat('trazado', r.nivel==='alto');
      if(r.nivel==='alto'){ sonidoGane(); hablar('¡Muy bien!'); if(!reduce()){var rc=wrap.getBoundingClientRect(); chispas(rc.left+rc.width/2,rc.top+rc.height/2);} setTimeout(function(){ir(1);},900); }
      else if(r.nivel==='medio'){ sonidoBien(); hablar('¡Muy bien! Probemos otra vez'); setTimeout(function(){guia();decir();},900); }
      else { sonidoBien(); hablar('¡Lo intentaste! Hagámoslo otra vez juntas'); setTimeout(function(){guia();decir();},900); }
    });
    tA.addEventListener('click',function(){setL='ABC';idx=0;tA.classList.add('sel');tN.classList.remove('sel');guia();decir();});
    tN.addEventListener('click',function(){setL='123';idx=0;tN.classList.add('sel');tA.classList.remove('sel');guia();decir();});
    function iniciar(){var w=wrap.clientWidth,h=wrap.clientHeight,dpr=window.devicePixelRatio||1;
      if(!w||!h){setTimeout(iniciar,50);return;}
      cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);ctx=cv.getContext('2d');ctx.scale(dpr,dpr);ctx.lineCap='round';ctx.lineJoin='round';
      W=w;H=h;guia();setTimeout(guia,300);
      var dib=false,lx=0,ly=0,gr=Math.max(16,Math.round(w*0.035));
      function pos(e){var r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
      function registrarPunto(p){ var u=trazoPuntos[trazoPuntos.length-1]; if(!u || distancia(u,p)>=4) trazoPuntos.push(p); }
      cv.addEventListener('pointerdown',function(e){dib=true;try{cv.setPointerCapture(e.pointerId);}catch(_){}var p=pos(e);lx=p.x;ly=p.y;registrarPunto(p);ctx.fillStyle=color;ctx.beginPath();ctx.arc(lx,ly,gr/2,0,Math.PI*2);ctx.fill();});
      cv.addEventListener('pointermove',function(e){if(!dib)return;e.preventDefault();var p=pos(e);ctx.strokeStyle=color;ctx.lineWidth=gr;ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(p.x,p.y);ctx.stroke();lx=p.x;ly=p.y;registrarPunto(p);});
      cv.addEventListener('pointerup',function(){dib=false;});cv.addEventListener('pointercancel',function(){dib=false;});cv.addEventListener('pointerleave',function(){dib=false;});
    }
    setTimeout(function(){iniciar();decir();},30);
  }

  /* =====================================================================
     ENGLISH WORLD — Mi mundo en inglés (guía: Ollie el búho)
     Recorrido: escuchar → observar → asociar → reconocer → repetir → reforzar.
     · Contenido en 15-ingles-datos.js (ampliable: agregar palabras/categorías ahí).
     · Progreso por perfil en lucia_p{id}_ingles.
     · Repetición espaciada sencilla (cajas 0–4 → 0,1,3,7,14 días).
     · Máximo 3 palabras NUEVAS por día en los juegos (Descubrir palabras es libre).
     · Nunca se exige pronunciar ni se califica la pronunciación.
     ===================================================================== */
  var ENGLISH_TODAS=[], ENGLISH_POR_ID={};
  ENGLISH.categorias.forEach(function(c){ c.palabras.forEach(function(p){ p.cat=c.id; ENGLISH_TODAS.push(p); ENGLISH_POR_ID[p.id]=p; }); });
  var INTERVALOS_DIAS=[0,1,3,7,14];
  var NUEVAS_POR_DIA=3;
  var progIngles={palabras:{},historias:{},hoy:{fecha:'',nuevas:[]},soporte:'es'};
  function cargarIngles(){
    var p=leerJSON(claves('ingles'),{},esObjeto);
    progIngles={palabras:{},historias:esObjeto(p.historias)?p.historias:{},hoy:esObjeto(p.hoy)&&Array.isArray(p.hoy.nuevas)?p.hoy:{fecha:'',nuevas:[]},soporte:p.soporte==='en'?'en':'es'};
    if(esObjeto(p.palabras)) Object.keys(p.palabras).forEach(function(id){ var w=p.palabras[id]; if(ENGLISH_POR_ID[id] && esObjeto(w)) progIngles.palabras[id]={v:+w.v||0,a:+w.a||0,f:+w.f||0,c:Math.max(0,Math.min(4,+w.c||0)),u:typeof w.u==='string'?w.u:''}; });
    if(progIngles.hoy.fecha!==fechaLocal()) progIngles.hoy={fecha:fechaLocal(),nuevas:[]};
  }
  function guardarIngles(){ escribir(claves('ingles'),progIngles); }
  function regPalabra(id){ if(!progIngles.palabras[id]) progIngles.palabras[id]={v:0,a:0,f:0,c:0,u:''}; return progIngles.palabras[id]; }
  function verPalabra(p){
    var nueva=!progIngles.palabras[p.id]; var w=regPalabra(p.id); w.v++; if(!w.u) w.u=fechaLocal(); guardarIngles();
    if(nueva){ var n=palabrasInglesVistas().length; if(n>=3) desbloquear('en_primeras'); if(n>=10) desbloquear('en_10');
      var cat=ENGLISH.categorias.filter(function(c){return c.id===p.cat;})[0];
      if(cat && cat.palabras.every(function(x){return progIngles.palabras[x.id];})) desbloquear('en_categoria'); }
  }
  function respuestaPalabra(id,bien){
    var w=regPalabra(id); if(bien){ w.a++; w.c=Math.min(4,w.c+1); } else { w.f++; w.c=Math.max(0,w.c-1); }
    w.u=fechaLocal(); guardarIngles(); registrarStat('ingles',bien);
  }
  function diasDesde(f){ if(!f) return 999; var p=f.split('-'); var d=new Date(+p[0],+p[1]-1,+p[2]); return Math.floor((Date.now()-d.getTime())/86400000); }
  function palabrasInglesVistas(){ return ENGLISH_TODAS.filter(function(p){ return progIngles.palabras[p.id]; }); }
  function palabrasAprendidas(){ return ENGLISH_TODAS.filter(function(p){ var w=progIngles.palabras[p.id]; return w && w.c>=3; }); }
  function palabrasPorReforzar(n){ return ENGLISH_TODAS.filter(function(p){ var w=progIngles.palabras[p.id]; return w && (w.f>w.a || (w.a+w.f>0 && w.c<2)); }).slice(0,n||99); }
  function fraccionIngles(){ var s=0; ENGLISH_TODAS.forEach(function(p){ var w=progIngles.palabras[p.id]; if(w) s+=0.4+0.15*w.c; }); return ENGLISH_TODAS.length? Math.min(1,s/ENGLISH_TODAS.length) : 0; }
  function vencida(p){ var w=progIngles.palabras[p.id]; return w && diasDesde(w.u)>=INTERVALOS_DIAS[w.c]; }
  /* Elige palabras para un juego: primero las vencidas/por reforzar, luego vistas,
     y como máximo NUEVAS_POR_DIA palabras nuevas (nivel 1 primero). */
  function elegirPalabras(n,filtro){
    var pool=ENGLISH_TODAS.filter(filtro||function(){return true;});
    var debidas=shuffle(pool.filter(vencida)), vistas=shuffle(pool.filter(function(p){return progIngles.palabras[p.id] && !vencida(p);}));
    var nuevasHoy=progIngles.hoy.nuevas, cupo=Math.max(0,NUEVAS_POR_DIA-nuevasHoy.length);
    var nuevas=pool.filter(function(p){return !progIngles.palabras[p.id];}).sort(function(a,b){return (a.nivel||1)-(b.nivel||1)||Math.random()-0.5;});
    var deHoy=nuevasHoy.map(function(id){return ENGLISH_POR_ID[id];}).filter(function(p){return p && pool.indexOf(p)>=0 && debidas.indexOf(p)<0;});
    var r=debidas.concat(deHoy);
    r=r.concat(nuevas.slice(0,cupo)).concat(vistas);
    if(r.length<n) r=r.concat(shuffle(nuevas.slice(cupo)));     // si aún no hay suficientes, se completa
    var out=[]; r.forEach(function(p){ if(out.indexOf(p)<0 && out.length<n) out.push(p); });
    out.forEach(function(p){ if(!progIngles.palabras[p.id] && nuevasHoy.indexOf(p.id)<0) nuevasHoy.push(p.id); });
    guardarIngles();
    return out;
  }

    cabEn('Repeat with Me',mundoIngles); marcarActividad('English: Repeat with Me');
    var lista=elegirPalabras(5), k=0;
    var zona=el('div',{clase:'en-repite'}); app.appendChild(zona);
    var est=filaEstrellas(lista.length,0); app.insertBefore(est,zona);
    var usarMic=ajustes.mic && micDisponible();
    function paso(){
      zona.innerHTML='';
      var p=lista[k];
      var t=el('button',{clase:'en-tarjeta mediana',attrs:{'aria-label':p.en},html:ilustracion(p,true)+'<span class="en-palabra" lang="en"></span>'});
      t.querySelector('.en-palabra').textContent=p.en;
      t.addEventListener('click',function(){ hablarEN(p.en,{lento:true}); });
      zona.appendChild(t);
      var turno=el('div',{clase:'en-turno',attrs:{'aria-live':'polite'}});
      zona.appendChild(turno);
      var acciones=el('div',{clase:'en-acciones'});
      acciones.appendChild(el('button',{clase:'btng',html:'<span aria-hidden="true">🔊</span> <span lang="en">Listen</span>',on:{click:function(){ hablarEN(p.en,{lento:true}); }}}));
      if(usarMic){
        acciones.appendChild(el('button',{clase:'btng mic',html:'<span aria-hidden="true">🎤</span> <span lang="en">My turn</span>',on:{click:function(){
          turno.textContent='👂'; hablar('','es');
          escuchar('en-US',function(r){
            var dijo=r.ok && r.texto;
            var acerto=dijo && r.texto.indexOf(p.en.toLowerCase())>=0;
            turno.textContent='';
            celebrarIntento(acerto?'Wow! '+p.en+'! Great!':'Great try!');
          }); }}}));
      }
      acciones.appendChild(el('button',{clase:'btng primario',html:'<span aria-hidden="true">👏</span> <span lang="en">I said it!</span>',on:{click:function(){ celebrarIntento('Great!'); }}}));
      zona.appendChild(acciones);
      verPalabra(p);
      // Escucha → pausa "Your turn!" → la niña repite si quiere (nunca se exige).
      hablarEN(p.en,{lento:true,fin:function(){ hablarEN(p.en,{encolar:true,fin:function(){ turno.textContent='Your turn!'; hablarEN('Your turn!',{encolar:true}); if(personajeActual) animarPersonaje(personajeActual,'senala'); }}); }});
      var listo=false;
      function celebrarIntento(frase){
        if(listo) return; listo=true; detenerEscucha();
        sonidoBien(); reaccionPersonaje(true); hablarEN(frase); desbloquear('en_repetir');
        encenderEstrella(est,k); k++;
        setTimeout(function(){ k<lista.length? paso() : fin(); },1600);
      }
    }
    function fin(){
      app.innerHTML='';
      app.appendChild(pantallaFiesta({pj:'ollie',titulo:'You did it!',decir:'You did it! ¡Repetiste muy bien!',estrellas:lista.length,
        botones:[{ico:'🔁',t:'Again',go:function(){ enRepite(); }},{ico:'🎵',t:'Chants',go:function(){ enCantos(); }},{ico:'🦉',t:'English World',go:function(){ mundoIngles(); }}]}));
    }
    paso();
  }

  /* =====================================================================
     MÚSICA — xilófono de colores + "Eco" (Lucía toca, la niña repite).
     Ritmo y escucha, sin respuestas "malas": cualquier intento se celebra.
     ===================================================================== */
  var TECLAS=[{n:'do',c:'#EC6A55',e:'🐶'},{n:'re',c:'#F2994A',e:'🐱'},{n:'mi',c:'#F2C94C',e:'🐥'},{n:'fa',c:'#6FCF97',e:'🐸'},
              {n:'sol',c:'#56CCF2',e:'🐳'},{n:'la',c:'#5B8DEF',e:'🦋'},{n:'si',c:'#9B6BD6',e:'🦄'},{n:'do2',c:'#E86FA6',e:'🌸'}];
  function musica(){
    pantallaBase(mundoJugar,{mundo:'jugar'}); marcarActividad('Música');
    var cab=el('div',{clase:'juego-cab'});
    var modo='libre', secuencia=[], pos=0, ecos=0;
    var bLibre=el('button',{clase:'tab sel',html:'<span aria-hidden="true">🎹</span> Tocar'}), bEco=el('button',{clase:'tab',html:'<span aria-hidden="true">👂</span> Eco'});
    cab.appendChild(el('div',{clase:'tabs'},[bLibre,bEco]));
    cab.appendChild(acompanante('lucia'));
    app.appendChild(cab);
    var est=filaEstrellas(5,0); est.style.visibility='hidden'; app.appendChild(est);
    var xilo=el('div',{clase:'xilofono'}), teclas=[];
    TECLAS.forEach(function(t,i){
      var b=el('button',{clase:'tecla',attrs:{'aria-label':'Nota '+t.n.replace('2','')}});
      b.style.setProperty('--tc',t.c); b.style.setProperty('--h',(100-i*6)+'%');
      b.innerHTML='<span aria-hidden="true">'+t.e+'</span>';
      b.addEventListener('pointerdown',function(e){ e.preventDefault(); tocar(i,true); });
      b.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); tocar(i,true); } });
      teclas.push(b); xilo.appendChild(b);
    });
    app.appendChild(xilo);
    function tocar(i,porNina){
      nota(NOTAS[TECLAS[i].n],0.7); animarTap(teclas[i],'suena',300);
      if(!porNina) return;
      registrarStatMusica();
      if(modo==='eco' && secuencia.length){
        pos++;
        if(pos>=secuencia.length){ ecos++; encenderEstrella(est,ecos-1); reaccionPersonaje(true); sonidoBien();
          hablar(['¡Qué bonito!','¡Lo repetiste!','¡Muy buen oído!'][rnd(3)]);
          secuencia=[]; pos=0;
          if(ecos>=5){ desbloquear('musica_win'); setTimeout(function(){ app.innerHTML=''; app.appendChild(pantallaFiesta({titulo:'¡Hiciste música!',decir:'¡Hiciste música! Escuchaste muy bien.',estrellas:5,botones:[{ico:'🔁',t:'Otra vez',go:musica},{ico:'⭐',t:'Otro juego',go:mundoJugar}],sugerir:'musica'})); },1300); }
          else setTimeout(nuevoEco,1700);
        }
      }
    }
    var contadorLibre=0;
    function registrarStatMusica(){ contadorLibre++; if(contadorLibre%12===0){ registrarStat('musica',true); if(contadorLibre>=24) desbloquear('musica_win'); } }
    function nuevoEco(){
      var largo=ecos<2?2:3; secuencia=[]; pos=0;
      var base=rnd(TECLAS.length-2); for(var k=0;k<largo;k++) secuencia.push(Math.min(TECLAS.length-1,base+rnd(3)));
      hablar('Escucha','es',{fin:function(){ secuencia.forEach(function(n,k){ setTimeout(function(){ tocar(n,false); },400+k*650); });
        setTimeout(function(){ hablar('¡Ahora tú!'); },400+secuencia.length*650+200); }});
    }
    bLibre.addEventListener('click',function(){ modo='libre'; bLibre.classList.add('sel'); bEco.classList.remove('sel'); est.style.visibility='hidden'; hablar('Toca las teclas y haz música'); });
    bEco.addEventListener('click',function(){ modo='eco'; ecos=0; bEco.classList.add('sel'); bLibre.classList.remove('sel'); est.style.visibility='visible';
      Array.prototype.forEach.call(est.children,function(x){x.className='';}); nuevoEco(); });
    _setTimeout(function(){ hablar('Toca las teclas y haz música'); },300);
  }

/* ===== js/90-padres.js ===== */
  /* =====================================================================
     PARA PAPÁS — puerta con PIN de 4 dígitos + panel sobrio para adultos.
     El PIN se guarda con sal y hash (no en texto plano). Su objetivo es evitar
     que una niña de 3 años entre por accidente; NO es una protección contra un
     adulto con acceso al dispositivo (cualquiera puede borrar los datos del sitio).
     ===================================================================== */
  function hashPin(sal,pin){ var h=2166136261>>>0, s=sal+'|'+pin+'|lucia';
    for(var r=0;r<2000;r++){ for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619)>>>0; } s=h.toString(36)+s.slice(0,24); }
    return h.toString(36); }
  function pinGuardado(){ var p=ajustes.pin; return (typeof p==='string' && /^[a-z0-9]+:[a-z0-9]+$/.test(p)) ? p : null; }
  function verificarPin(pin){ var p=pinGuardado(); if(!p) return false; var x=p.split(':'); return hashPin(x[0],pin)===x[1]; }
  function fijarPin(pin){ var sal=Math.random().toString(36).slice(2,10)||'s'; ajustes.pin=sal+':'+hashPin(sal,pin); guardarAjustes(); }
  var _fallosPin=0, _bloqueoPinHasta=0;

  /* puertaPadres(alAbrir, alCancelar): teclado numérico en un diálogo. */
  function puertaPadres(alAbrir,alCancelar){
    var creando=!pinGuardado(), primero=null, valor='';
    var ov=el('div',{clase:'overlay puerta',attrs:{role:'dialog','aria-modal':'true','aria-labelledby':'puerta-t'}});
    var card=el('div',{clase:'overlay-card adulto puerta-card'});
    var tit=el('h2',{attrs:{id:'puerta-t'}}), sub=el('p',{clase:'puerta-sub'});
    var puntos=el('div',{clase:'pin-puntos',attrs:{'aria-hidden':'true'}},[el('i'),el('i'),el('i'),el('i')]);
    var msg=el('p',{clase:'pin-msg',attrs:{role:'alert'}});
    card.appendChild(tit); card.appendChild(sub); card.appendChild(puntos); card.appendChild(msg);
    var teclado=el('div',{clase:'pin-teclado'});
    ['1','2','3','4','5','6','7','8','9','','0','⌫'].forEach(function(k){
      if(!k){ teclado.appendChild(el('span')); return; }
      teclado.appendChild(el('button',{clase:'pin-tecla',texto:k,attrs:{'aria-label':k==='⌫'?'Borrar dígito':k},on:{click:function(){ tecla(k); }}}));
    });
    card.appendChild(teclado);
    var pie=el('div',{clase:'overlay-btns'});
    pie.appendChild(el('button',{clase:'btn-adulto',texto:'Cancelar',on:{click:function(){ cerrar(); if(alCancelar) alCancelar(); }}}));
    if(!creando) pie.appendChild(el('button',{clase:'btn-adulto link',texto:'¿Olvidaste el PIN?',on:{click:recuperar}}));
    card.appendChild(pie);
    ov.appendChild(card); document.body.appendChild(ov);
    function onKey(e){ if(/^[0-9]$/.test(e.key)) tecla(e.key); else if(e.key==='Backspace') tecla('⌫'); else if(e.key==='Escape'){ cerrar(); if(alCancelar) alCancelar(); } }
    document.addEventListener('keydown',onKey);
    function cerrar(){ document.removeEventListener('keydown',onKey); ov.remove(); }
    function textos(){
      if(creando){ tit.textContent=primero?'Repite el PIN':'Crea un PIN para adultos'; sub.textContent='4 dígitos. Lo pedirá cada vez que se entre a la zona de adultos.'; }
      else { tit.textContent='Zona de adultos'; sub.textContent='Escribe el PIN de 4 dígitos.'; }
    }
    function pintarPuntos(){ Array.prototype.forEach.call(puntos.children,function(p,i){ p.className=i<valor.length?'on':''; }); }
    function tecla(k){
      if(Date.now()<_bloqueoPinHasta){ msg.textContent='Espera unos segundos e inténtalo de nuevo.'; return; }
      if(k==='⌫'){ valor=valor.slice(0,-1); pintarPuntos(); return; }
      if(valor.length>=4) return;
      valor+=k; pintarPuntos();
      if(valor.length===4) _setTimeout(completo,120);
    }
    function completo(){
      if(creando){
        if(!primero){ primero=valor; valor=''; msg.textContent=''; textos(); pintarPuntos(); return; }
        if(primero!==valor){ primero=null; valor=''; msg.textContent='No coinciden. Empecemos de nuevo.'; textos(); pintarPuntos(); return; }
        fijarPin(valor); cerrar(); aviso('PIN creado'); alAbrir(); return;
      }
      if(verificarPin(valor)){ _fallosPin=0; cerrar(); alAbrir(); return; }
      _fallosPin++; valor=''; pintarPuntos(); animarTap(puntos,'mal',450);
      if(_fallosPin>=3){ _bloqueoPinHasta=Date.now()+30000; _fallosPin=0; msg.textContent='Demasiados intentos. Espera 30 segundos.'; }
      else msg.textContent='PIN incorrecto.';
    }
    /* Recuperación: exige escribir una frase (una niña que no lee no puede hacerlo).
       Solo quita el PIN; no borra ningún dato. */
    function recuperar(){
      card.innerHTML='';
      card.appendChild(el('h2',{texto:'Restablecer PIN'}));
      card.appendChild(el('p',{clase:'puerta-sub',texto:'Escribe exactamente: BORRAR PIN — se quitará el PIN (los datos no se borran) y podrás crear uno nuevo.'}));
      var inp=el('input',{attrs:{type:'text',autocomplete:'off','aria-label':'Frase de confirmación',autocapitalize:'characters'}});
      card.appendChild(el('label',{clase:'campo'},[inp]));
      var m2=el('p',{clase:'pin-msg',attrs:{role:'alert'}}); card.appendChild(m2);
      card.appendChild(el('div',{clase:'overlay-btns'},[
        el('button',{clase:'btn-adulto',texto:'Cancelar',on:{click:function(){ cerrar(); if(alCancelar) alCancelar(); }}}),
        el('button',{clase:'btn-adulto primario',texto:'Restablecer',on:{click:function(){
          if(inp.value.trim().toUpperCase()==='BORRAR PIN'){ ajustes.pin=null; guardarAjustes(); cerrar(); puertaPadres(alAbrir,alCancelar); }
          else m2.textContent='El texto no coincide.'; }}})
      ]));
      inp.focus();
    }
    textos();
    var t1=card.querySelector('.pin-tecla'); if(t1) t1.focus();
  }

  function graficoDias(dias){

  /* ---------- DATOS: exportar, importar, reiniciar ---------- */
  function clavesApp(){ var r=[]; try{ for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(k && k.indexOf('lucia_')===0) r.push(k); } }catch(e){} return r; }
  function exportarDatos(){
    var datos={}; clavesApp().forEach(function(k){ datos[k]=localStorage.getItem(k); });
    var paquete={app:'lucia-aprende-jugando',formato:1,version:VERSION_APP,fecha:new Date().toISOString(),datos:datos};
    var blob=new Blob([JSON.stringify(paquete)],{type:'application/json'});
    var url=URL.createObjectURL(blob), a=el('a',{attrs:{href:url,download:'lucia-respaldo-'+fechaLocal()+'.json'}});
    document.body.appendChild(a); a.click(); a.remove(); _setTimeout(function(){ URL.revokeObjectURL(url); },4000);
    aviso('Respaldo descargado');
  }
  var CLAVE_VALIDA=/^lucia_(perfiles|bilingue|ajustes|completados|stats|galeria|explorado|stickers|p[012]_(niveles|config|completados|stats|explorado|stickers|adapt|limite|sesiones|galeria|ingles|descanso))$/;
  function importarDatos(archivo,cb){
    if(!archivo || archivo.size>15*1024*1024){ cb('El archivo no es válido o es demasiado grande.'); return; }
    var lector=new FileReader();
    lector.onload=function(){
      var p; try{ p=JSON.parse(String(lector.result)); }catch(e){ cb('El archivo no es un respaldo de Lucía.'); return; }
      if(!esObjeto(p) || p.app!=='lucia-aprende-jugando' || !esObjeto(p.datos)){ cb('El archivo no es un respaldo de Lucía.'); return; }
      var claves=Object.keys(p.datos).filter(function(k){ return CLAVE_VALIDA.test(k) && typeof p.datos[k]==='string' && p.datos[k].length<5*1024*1024; });
      if(!claves.length){ cb('El respaldo no contiene datos.'); return; }
      confirmar('Se reemplazará el progreso actual de este dispositivo por el del respaldo ('+claves.length+' datos, del '+String(p.fecha||'').slice(0,10)+'). ¿Continuar?','Importar',function(){
        var previas=clavesApp(), copia={}; previas.forEach(function(k){ copia[k]=localStorage.getItem(k); });
        try{
          previas.forEach(function(k){ if(k!=='lucia_ajustes') localStorage.removeItem(k); });
          claves.forEach(function(k){ if(k==='lucia_ajustes') return; localStorage.setItem(k,p.datos[k]); });
          cb(null);
        }catch(e){ // si falla (cuota), se restaura lo anterior
          try{ clavesApp().forEach(function(k){ localStorage.removeItem(k); }); Object.keys(copia).forEach(function(k){ localStorage.setItem(k,copia[k]); }); }catch(e2){}
          cb('No hay espacio suficiente para importar. No se cambió nada.');
        }
      });
    };
    lector.onerror=function(){ cb('No se pudo leer el archivo.'); };
    lector.readAsText(archivo);
  }
  function secDatos(c){
    c.appendChild(tarjeta('Respaldo',[
      el('p',{clase:'nota',texto:'Descarga un archivo con perfiles, progreso, stickers, palabras en inglés y dibujos. Sirve para pasar el progreso a otro dispositivo o a la versión publicada (GitHub Pages).'}),
      el('button',{clase:'btn-adulto primario',texto:'Exportar progreso',on:{click:exportarDatos}})
    ]));
    var inp=el('input',{attrs:{type:'file',accept:'application/json,.json','aria-label':'Archivo de respaldo'}});
    var msg=el('p',{clase:'pin-msg',attrs:{role:'status'}});
    inp.addEventListener('change',function(){ importarDatos(inp.files&&inp.files[0],function(err){ if(err){ msg.textContent=err; } else { perfilActual=null; aviso('Progreso importado'); pantallaPerfiles(); } inp.value=''; }); });
    c.appendChild(tarjeta('Importar un respaldo',[ el('p',{clase:'nota',texto:'Reemplaza los datos de este dispositivo. Los ajustes y el PIN actuales se conservan.'}), inp, msg ]));
    if(perfilActual!=null){

        el('button',{clase:'btn-adulto peligro',texto:'Reiniciar progreso del perfil',on:{click:function(){

            ['niveles','completados','stats','explorado','stickers','adapt','sesiones','ingles','descanso'].forEach(function(b){ try{ localStorage.removeItem(claves(b)); }catch(e){} });

      ]));
    }
    c.appendChild(tarjeta('Borrar todo',[
      el('p',{clase:'nota',texto:'Elimina todos los perfiles, el progreso, los dibujos, los ajustes y el PIN de este dispositivo.'}),
      el('button',{clase:'btn-adulto peligro',texto:'Borrar toda la información',on:{click:function(){
        confirmar('¿Eliminar TODA la información de la app en este dispositivo? No se puede deshacer.','Eliminar todo',function(){
          clavesApp().forEach(function(k){ try{ localStorage.removeItem(k); }catch(e){} });
          ajustes=JSON.parse(JSON.stringify(AJUSTES_DEF)); sonido=true; perfilActual=null; pantallaPerfiles(); }); }}})
    ]));
    c.appendChild(tarjeta('Privacidad',[ el('ul',{clase:'lista'},[
      'Todo se guarda solo en este dispositivo (almacenamiento local del navegador).',
      'Sin publicidad, sin rastreadores, sin cuentas y sin conexión a servidores.',
      'No se graban ni guardan voces. El micrófono es opcional y está apagado por defecto.',
      'Solo se pide el nombre (o apodo) del niño; no se piden otros datos personales.'
    ].map(function(t){return el('li',{texto:t});})) ]));
  }

/* ===== js/99-arranque.js ===== */
  /* =====================================================================
     ARRANQUE: botones fijos, service worker (modo sin conexión) y primera pantalla.
     ===================================================================== */
  function actualizarBtnSon(){ btnSon.classList.toggle('apagado',!sonido); btnSon.setAttribute('aria-pressed',String(sonido)); btnSon.setAttribute('aria-label',sonido?'Sonido encendido':'Sonido apagado'); }
  function actualizarBtnIdioma(){ btnIdioma.querySelector('.idioma-txt').textContent=modoBilingue?'ES·EN':'ES'; btnIdioma.setAttribute('aria-pressed',String(modoBilingue)); btnIdioma.classList.toggle('activo',modoBilingue); }
  btnAtras.addEventListener('click',function(){ sonidoTap(); var f=contextoAtras; f(); });
  /* Silenciar requiere mantener 1 s (evita que la niña lo apague sin querer);
     un toque corto solo da una pista. Desde el panel de papás se cambia libremente. */
  (function(){ var t=null, hecho=false;
    btnSon.addEventListener('pointerdown',function(){ hecho=false; btnSon.classList.add('presionando'); t=_setTimeout(function(){ hecho=true; btnSon.classList.remove('presionando');
      sonido=!sonido; ajustes.sonido=sonido; guardarAjustes(); actualizarBtnSon(); if(sonido) hablar('¡Sonido encendido!'); else if('speechSynthesis' in window) speechSynthesis.cancel(); },900); });
    function soltar(){ if(t){ clearTimeout(t); t=null; } btnSon.classList.remove('presionando'); }
    btnSon.addEventListener('pointerup',soltar); btnSon.addEventListener('pointerleave',soltar); btnSon.addEventListener('pointercancel',soltar);
    btnSon.addEventListener('click',function(e){ if(e.detail===0){ sonido=!sonido; ajustes.sonido=sonido; guardarAjustes(); actualizarBtnSon(); } else if(!hecho){ animarTap(btnSon,'rebota',350); } });
  })();
  btnIdioma.addEventListener('click',function(){
    modoBilingue=!modoBilingue; guardarBilingue(); actualizarBtnIdioma();
    if(modoBilingue) hablar('Spanish and English','en'); else hablar('Español');
    if(pantalla.indexOf('cat:')===0) categoria(pantalla.slice(4));
  });
  document.addEventListener('visibilitychange',function(){ if(document.hidden) guardarSesionActual(); });
  window.addEventListener('pagehide',function(){ guardarSesionActual(); });

  /* Service worker: solo cuando se sirve por http(s) (GitHub Pages). Abierto como archivo, no aplica. */
  if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
    window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  }

  cargarBilingue(); actualizarBtnIdioma(); actualizarBtnSon();
  try{ escribir('lucia_version',VERSION_APP); }catch(e){}
  pantallaPerfiles();

})();
